name: Production Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Model Weights (Integrity Check)
        run: |
          echo "Verifying presence of neural weights..."
          # Since weights are in the repo, we verify they exist before trigger
          ls cnn+clahe/model_cnn_clahe.keras || (echo "Weights missing: cnn+clahe" && exit 1)
          ls resnet50/model_resnet50.keras || (echo "Weights missing: resnet50" && exit 1)

      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --working-directory frontend'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Trigger Railway Redeployment (Backend)
        run: |
          # Railway typically redeploys automatically on push to 'main'
          # This step is an extra safety pull if using external triggers
          echo "Railway triggered via Main branch push."
